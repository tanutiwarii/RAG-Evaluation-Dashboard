services:
  api:
    build: ./Backend
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./Frontend
    ports: ["3000:3000"]
    depends_on: [api]

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: rageval
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rageval"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow
    ports: ["5001:5000"]
    command: mlflow server --host 0.0.0.0

volumes:
  pgdata: