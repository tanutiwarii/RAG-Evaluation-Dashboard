services:
  backend:
    build:
      context: ./Backend
    container_name: rag-dashboard-backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend/uploads:/app/uploads
      - ./Backend/chroma_db:/app/chroma_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./Frontend
    container_name: rag-dashboard-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0